name: Build launcher

# Builds the Windows installer. Every push to main makes one you can download
# from the run's Artifacts; pushing a tag like v0.1.0 also makes a Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install CLI
        run: npm install

      - name: Icons
        run: npm run tauri icon app-icon.png

      - name: Build
        run: npm run tauri build

      - name: Collect installer
        shell: bash
        run: |
          mkdir out
          # Keep the versioned installer, and also a stable name so the
          # website's download page can link to a URL that never changes.
          cp src-tauri/target/release/bundle/nsis/*-setup.exe out/ || true
          cp src-tauri/target/release/bundle/nsis/*-setup.exe out/SauFox-Setup.exe || true
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SauFox-launcher-windows
          path: out/*.exe
          if-no-files-found: warn

      # Every push to main refreshes a rolling "latest" release, so
      # https://github.com/thexfoxy/Launcher.SauFox/releases/latest/download/SauFox-Setup.exe
      # always points at the newest installer. A version tag also lands here.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SauFox Launcher (latest)
          body: The newest SauFox launcher for Windows. Download SauFox-Setup.exe and run it.
          make_latest: true
          files: out/*.exe
