<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SauFox</title>
    <!-- The update window: only shows what the launcher's backend reports
         (src-tauri/src/updater.rs). It can't start or change an update. -->
    <style>
      @font-face {
        font-family: "Inter";
        src: url("inter-latin.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Vazirmatn";
        src: url("vazirmatn-nl.woff2") format("woff2");
        font-weight: 100 900;
      }
      :root {
        --bg: #0a0a0d;
        --text: #f6f4ef;
        --muted: #9a96a3;
        --accent: #ff7a1a;
        --accent-2: #ffb35e;
        --glass: rgba(255, 255, 255, 0.06);
        --glass-line: rgba(255, 255, 255, 0.14);
        --font: "Inter", system-ui, "Segoe UI", sans-serif;
        color-scheme: dark;
      }
      :lang(fa) {
        --font: "Vazirmatn", "Inter", Tahoma, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        user-select: none;
      }
      /* Soft orange light behind the glass */
      .stage {
        position: relative;
        height: 100%;
        padding: 18px;
        background:
          radial-gradient(60% 70% at 12% 10%, rgba(255, 122, 26, 0.45), transparent 65%),
          radial-gradient(55% 60% at 95% 100%, rgba(255, 70, 20, 0.28), transparent 65%),
          linear-gradient(160deg, #17141a, #0a0a0d 60%);
        overflow: hidden;
      }
      .blob {
        position: absolute;
        width: 160px;
        height: 160px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #ffb35e, #ff7a1a 55%, transparent 72%);
        filter: blur(30px);
        opacity: 0.45;
        top: -40px;
        left: -30px;
        animation: drift 9s ease-in-out infinite alternate;
        pointer-events: none;
      }
      /* The glass card */
      .card {
        position: relative;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 22px;
        align-items: center;
        height: 100%;
        padding: 22px 24px;
        border: 1px solid var(--glass-line);
        border-radius: 22px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.03));
        backdrop-filter: blur(22px) saturate(140%);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.18),
          inset 0 -1px 0 rgba(0, 0, 0, 0.3),
          0 24px 50px rgba(0, 0, 0, 0.55);
        animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      /* Tactile progress ring */
      .ring {
        position: relative;
        width: 132px;
        height: 132px;
        border-radius: 50%;
        background: linear-gradient(145deg, #1d1a20, #0e0d11);
        box-shadow:
          8px 8px 18px rgba(0, 0, 0, 0.55),
          -6px -6px 16px rgba(255, 255, 255, 0.05),
          inset 0 1px 0 rgba(255, 255, 255, 0.08);
        display: grid;
        place-items: center;
      }
      .ring svg {
        position: absolute;
        inset: 8px;
        width: calc(100% - 16px);
        height: calc(100% - 16px);
        transform: rotate(-90deg);
        overflow: visible;
      }
      .ring circle {
        fill: none;
        stroke-width: 7;
        stroke-linecap: round;
      }
      .ring .track {
        stroke: rgba(255, 255, 255, 0.07);
      }
      .ring .fill {
        stroke: url(#grad);
        stroke-dasharray: 289;
        stroke-dashoffset: 289;
        filter: drop-shadow(0 0 6px rgba(255, 122, 26, 0.9));
        transition: stroke-dashoffset 0.35s ease;
      }
      .ring.is-busy svg {
        animation: spin 1.1s linear infinite;
      }
      .ring.is-busy .fill {
        stroke-dashoffset: 210;
      }
      .ring__core {
        position: relative;
        display: grid;
        place-items: center;
        width: 78px;
        height: 78px;
        border-radius: 50%;
        background: linear-gradient(145deg, #232027, #121115);
        box-shadow:
          inset 3px 3px 8px rgba(0, 0, 0, 0.6),
          inset -2px -2px 6px rgba(255, 255, 255, 0.05);
      }
      .ring__core img {
        width: 40px;
        height: auto;
        filter: drop-shadow(0 4px 12px rgba(255, 122, 26, 0.5));
      }
      .ring__pct {
        position: absolute;
        font-size: 20px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        color: var(--text);
        text-shadow: 0 0 14px rgba(255, 122, 26, 0.6);
      }
      .ring.has-pct .ring__core img {
        opacity: 0;
      }
      .info {
        display: grid;
        gap: 10px;
        min-width: 0;
      }
      .info__title {
        margin: 0;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.2px;
      }
      .chip {
        justify-self: start;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.03));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 6px 14px rgba(0, 0, 0, 0.35);
        font-size: 12px;
        font-weight: 700;
        color: #ffc48f;
      }
      .chip::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 10px var(--accent);
      }
      /* Slider-like bar with a glowing knob */
      .bar {
        position: relative;
        height: 8px;
        margin: 6px 0 2px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.4);
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6), 0 1px 0 rgba(255, 255, 255, 0.06);
      }
      .bar span {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent), var(--accent-2));
        box-shadow: 0 0 14px rgba(255, 122, 26, 0.6);
        transition: width 0.35s ease;
      }
      .bar span::after {
        content: "";
        position: absolute;
        right: -9px;
        top: 50%;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        transform: translateY(-50%);
        background: linear-gradient(145deg, #ffffff, #d9d4cc);
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.5), 0 0 0 3px rgba(255, 122, 26, 0.35);
      }
      [dir="rtl"] .bar span {
        inset: 0 0 0 auto;
        background: linear-gradient(270deg, var(--accent), var(--accent-2));
      }
      [dir="rtl"] .bar span::after {
        right: auto;
        left: -9px;
      }
      .bar.is-busy span {
        width: 30%;
        animation: busy 1.3s ease-in-out infinite;
      }
      .bar.is-busy span::after {
        display: none;
      }
      .note {
        min-height: 18px;
        margin: 0;
        font-size: 12.5px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .note.is-error {
        color: #ff8a7a;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(12px) scale(0.98);
        }
      }
      @keyframes spin {
        to {
          transform: rotate(270deg);
        }
      }
      @keyframes drift {
        to {
          transform: translate(40px, 30px);
        }
      }
      @keyframes busy {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(340%);
        }
      }
      [dir="rtl"] .bar.is-busy span {
        animation-name: busy-rtl;
      }
      @keyframes busy-rtl {
        from {
          transform: translateX(110%);
        }
        to {
          transform: translateX(-340%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage" data-tauri-drag-region>
      <div class="blob"></div>
      <section class="card" data-tauri-drag-region>
        <div class="ring is-busy" id="ring">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <defs>
              <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ffb35e" />
                <stop offset="1" stop-color="#ff7a1a" />
              </linearGradient>
            </defs>
            <circle class="track" cx="50" cy="50" r="46" />
            <circle class="fill" cx="50" cy="50" r="46" />
          </svg>
          <div class="ring__core"><img src="logo.webp" alt="" /><span class="ring__pct" id="pct"></span></div>
        </div>
        <div class="info">
          <h1 class="info__title" id="title">Updating SauFox</h1>
          <span class="chip" id="ver" dir="ltr"></span>
          <div class="bar is-busy" id="bar"><span></span></div>
          <p class="note" id="note"></p>
        </div>
      </section>
    </main>
    <script>
      (function () {
        var lang = "en";
        try {
          lang = localStorage.getItem("saufox.launcher.lang") || ((navigator.language || "").indexOf("fa") === 0 ? "fa" : "en");
        } catch (e) {}
        var fa = lang === "fa";
        document.documentElement.lang = lang;
        document.documentElement.dir = fa ? "rtl" : "ltr";
        var num = function (n) {
          return fa ? String(n).replace(/\d/g, function (d) { return "۰۱۲۳۴۵۶۷۸۹"[d]; }) : String(n);
        };
        var T = fa
          ? { title: "در حال به‌روزرسانی ساوفاکس", start: "در حال آماده‌سازی…", down: "در حال دانلود", install: "در حال نصب… لانچر خودش دوباره باز می‌شود.", error: "به‌روزرسانی انجام نشد. لانچر با نسخه‌ی فعلی باز می‌شود.", mb: "مگابایت" }
          : { title: "Updating SauFox", start: "Getting ready…", down: "Downloading", install: "Installing… the launcher will open again by itself.", error: "The update didn't go through. Opening the current version.", mb: "MB" };
        var info = window.__SAUFOX_UPDATE__ || {};
        var $ = function (id) { return document.getElementById(id); };
        $("title").textContent = T.title;
        $("ver").textContent = info.version ? (info.current ? "v" + info.current + "  →  " : "") + "v" + info.version : "";
        $("ver").hidden = !info.version;
        $("note").textContent = T.start;
        var mb = function (b) { return num((b / 1e6).toFixed(1)).replace(".", fa ? "٫" : "."); };
        var listen = window.__TAURI__ && window.__TAURI__.event && window.__TAURI__.event.listen;
        if (!listen) return;
        listen("update-progress", function (e) {
          var p = e.payload || {};
          var bar = $("bar"), note = $("note"), ring = $("ring");
          var busy = function (on) {
            bar.classList.toggle("is-busy", on);
            ring.classList.toggle("is-busy", on);
            if (on) {
              bar.firstChild.style.width = "";
              ring.querySelector(".fill").style.strokeDashoffset = "";
              ring.classList.remove("has-pct");
              $("pct").textContent = "";
            }
          };
          if (p.phase === "install") {
            busy(true);
            note.textContent = T.install;
          } else if (p.phase === "error") {
            busy(false);
            note.textContent = T.error;
            note.classList.add("is-error");
          } else if (p.total) {
            busy(false);
            var pct = Math.min(100, Math.round((p.received / p.total) * 100));
            bar.firstChild.style.width = pct + "%";
            ring.querySelector(".fill").style.strokeDashoffset = String(289 * (1 - pct / 100));
            ring.classList.add("has-pct");
            $("pct").textContent = num(pct) + (fa ? "٪" : "%");
            note.textContent = fa
              ? "\u2066" + num(pct) + "٪\u2069 دانلود شد (" + mb(p.received) + " از " + mb(p.total) + " " + T.mb + ")"
              : T.down + " · " + mb(p.received) + " / " + mb(p.total) + " " + T.mb + " · " + pct + "%";
          } else {
            note.textContent = T.down + " · " + mb(p.received) + " " + T.mb;
          }
        });
      })();
    </script>
  </body>
</html>
