<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SauFox</title>
    <!-- The update window: only shows what the launcher's backend reports
         (src-tauri/src/updater.rs). It can't start or change an update. -->
    <style>
      @font-face {
        font-family: "Inter";
        src: url("inter-latin.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Vazirmatn";
        src: url("vazirmatn-nl.woff2") format("woff2");
        font-weight: 100 900;
      }
      :root {
        --bg: #0a0a0d;
        --text: #f6f4ef;
        --muted: #8b8894;
        --accent: #ff7a1a;
        --line: rgba(255, 255, 255, 0.08);
        --font: "Inter", system-ui, "Segoe UI", sans-serif;
        color-scheme: dark;
      }
      :lang(fa) {
        --font: "Vazirmatn", "Inter", Tahoma, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        user-select: none;
      }
      .up {
        position: relative;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 14px;
        height: 100%;
        padding: 28px 34px;
        border: 1px solid var(--line);
        background:
          radial-gradient(90% 70% at 15% 0%, rgba(255, 122, 26, 0.22), transparent 60%),
          radial-gradient(80% 70% at 100% 100%, rgba(52, 230, 255, 0.1), transparent 60%),
          var(--bg);
        overflow: hidden;
      }
      /* faint grid, like the launcher */
      .up::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 28px 28px;
        mask-image: radial-gradient(80% 80% at 50% 40%, #000, transparent);
        pointer-events: none;
      }
      .up > * {
        position: relative;
      }
      .up__logo {
        width: 66px;
        height: auto;
        filter: drop-shadow(0 8px 24px rgba(255, 122, 26, 0.35));
        animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .up__title {
        margin: 4px 0 0;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: 0.2px;
        text-align: center;
        animation: rise 0.7s 0.06s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .up__ver {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        padding: 5px 12px;
        border: 1px solid rgba(255, 122, 26, 0.35);
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        color: #ffb070;
        background: rgba(255, 122, 26, 0.08);
        animation: rise 0.7s 0.12s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .up__bar {
        width: 100%;
        height: 8px;
        margin-top: 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
        animation: rise 0.7s 0.18s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .up__bar span {
        display: block;
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent), #ffb35e);
        box-shadow: 0 0 16px rgba(255, 122, 26, 0.6);
        transition: width 0.3s ease;
      }
      .up__bar.is-busy span {
        width: 35%;
        animation: busy 1.2s ease-in-out infinite;
      }
      .up__note {
        min-height: 18px;
        margin: 0;
        font-size: 12.5px;
        color: var(--muted);
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .up__note.is-error {
        color: #ff8a7a;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
      }
      @keyframes busy {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(320%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="up" data-tauri-drag-region>
      <img class="up__logo" src="logo.webp" alt="" />
      <h1 class="up__title" id="title">Updating SauFox</h1>
      <span class="up__ver" id="ver" dir="ltr"></span>
      <div class="up__bar is-busy" id="bar"><span></span></div>
      <p class="up__note" id="note"></p>
    </main>
    <script>
      (function () {
        var lang = "en";
        try {
          lang = localStorage.getItem("saufox.launcher.lang") || ((navigator.language || "").indexOf("fa") === 0 ? "fa" : "en");
        } catch (e) {}
        var fa = lang === "fa";
        document.documentElement.lang = lang;
        document.documentElement.dir = fa ? "rtl" : "ltr";
        var num = function (n) {
          return fa ? String(n).replace(/\d/g, function (d) { return "۰۱۲۳۴۵۶۷۸۹"[d]; }) : String(n);
        };
        var T = fa
          ? { title: "در حال به‌روزرسانی ساوفاکس", start: "در حال آماده‌سازی…", down: "در حال دانلود", install: "در حال نصب… لانچر خودش دوباره باز می‌شود.", error: "به‌روزرسانی انجام نشد. لانچر با نسخه‌ی فعلی باز می‌شود.", mb: "مگابایت" }
          : { title: "Updating SauFox", start: "Getting ready…", down: "Downloading", install: "Installing… the launcher will open again by itself.", error: "The update didn't go through. Opening the current version.", mb: "MB" };
        var info = window.__SAUFOX_UPDATE__ || {};
        var $ = function (id) { return document.getElementById(id); };
        $("title").textContent = T.title;
        $("ver").textContent = info.version ? (info.current ? "v" + info.current + "  →  " : "") + "v" + info.version : "";
        $("ver").hidden = !info.version;
        $("note").textContent = T.start;
        var mb = function (b) { return num((b / 1e6).toFixed(1)).replace(".", fa ? "٫" : "."); };
        var listen = window.__TAURI__ && window.__TAURI__.event && window.__TAURI__.event.listen;
        if (!listen) return;
        listen("update-progress", function (e) {
          var p = e.payload || {};
          var bar = $("bar"), note = $("note");
          if (p.phase === "install") {
            bar.classList.add("is-busy");
            bar.firstChild.style.width = "";
            note.textContent = T.install;
          } else if (p.phase === "error") {
            bar.classList.remove("is-busy");
            note.textContent = T.error;
            note.classList.add("is-error");
          } else if (p.total) {
            bar.classList.remove("is-busy");
            var pct = Math.min(100, Math.round((p.received / p.total) * 100));
            bar.firstChild.style.width = pct + "%";
            note.textContent = fa
              ? num(pct) + "٪ دانلود شد (" + mb(p.received) + " از " + mb(p.total) + " " + T.mb + ")"
              : T.down + " · " + mb(p.received) + " / " + mb(p.total) + " " + T.mb + " · " + pct + "%";
          } else {
            note.textContent = T.down + " · " + mb(p.received) + " " + T.mb;
          }
        });
      })();
    </script>
  </body>
</html>
