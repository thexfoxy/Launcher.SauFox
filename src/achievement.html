<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SauFox</title>
    <!-- The achievement popup (src-tauri/src/popup.rs): shows what the
         launcher passes in, nothing else. -->
    <style>
      @font-face {
        font-family: "Inter";
        src: url("inter-latin.woff2") format("woff2");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Vazirmatn";
        src: url("vazirmatn-nl.woff2") format("woff2");
        font-weight: 100 900;
      }
      :root {
        --text: #f6f4ef;
        --muted: #a29fa8;
        --accent: #ff7a1a;
        --font: "Inter", system-ui, "Segoe UI", sans-serif;
        color-scheme: dark;
      }
      :lang(fa) {
        --font: "Vazirmatn", "Inter", Tahoma, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        color: var(--text);
        font-family: var(--font);
        user-select: none;
      }
      .card {
        position: relative;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 14px;
        align-items: center;
        height: 100%;
        padding: 14px 18px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 20px;
        background:
          radial-gradient(70% 120% at 0% 0%, rgba(255, 122, 26, 0.4), transparent 70%),
          linear-gradient(150deg, #1d1a20, #0d0c10);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
        overflow: hidden;
        animation:
          in 0.6s cubic-bezier(0.22, 1, 0.36, 1) both,
          out 0.5s ease-in 5.8s forwards;
      }
      [dir="rtl"] .card {
        background:
          radial-gradient(70% 120% at 100% 0%, rgba(255, 122, 26, 0.4), transparent 70%),
          linear-gradient(210deg, #1d1a20, #0d0c10);
      }
      /* sheen passing once */
      .card::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(115deg, transparent 40%, rgba(255, 255, 255, 0.16) 50%, transparent 60%);
        transform: translateX(-120%);
        animation: sheen 1.4s 0.5s ease-in-out forwards;
      }
      .badge {
        position: relative;
        display: grid;
        place-items: center;
        width: 62px;
        height: 62px;
        border-radius: 50%;
        background: linear-gradient(145deg, #232027, #111014);
        box-shadow:
          5px 5px 12px rgba(0, 0, 0, 0.55),
          -3px -3px 10px rgba(255, 255, 255, 0.04),
          0 0 0 3px rgba(255, 122, 26, 0.85),
          0 0 22px rgba(255, 122, 26, 0.65);
        animation: pop 0.7s 0.15s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .badge svg {
        width: 30px;
        height: 30px;
        fill: #ffb35e;
        filter: drop-shadow(0 0 8px rgba(255, 122, 26, 0.8));
      }
      .text {
        min-width: 0;
        display: grid;
        gap: 3px;
      }
      .label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.4px;
        text-transform: uppercase;
        color: #ffb070;
      }
      :lang(fa) .label {
        letter-spacing: 0;
        font-size: 12px;
      }
      .title {
        font-size: 15.5px;
        font-weight: 800;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .desc {
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      @keyframes in {
        from {
          opacity: 0;
          transform: translateY(24px) scale(0.96);
        }
      }
      @keyframes out {
        to {
          opacity: 0;
          transform: translateY(16px);
        }
      }
      @keyframes pop {
        from {
          transform: scale(0.4);
          opacity: 0;
        }
      }
      @keyframes sheen {
        to {
          transform: translateX(120%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .card,
        .card::after,
        .badge {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M7 3h10v2h3v3a5 5 0 0 1-4.6 5A5 5 0 0 1 13 15.9V18h3v3H8v-3h3v-2.1A5 5 0 0 1 8.6 13 5 5 0 0 1 4 8V5h3Zm-1 4v1a3 3 0 0 0 1.4 2.5A7.6 7.6 0 0 1 7 8V7Zm12 0h-1v1c0 .9-.1 1.7-.4 2.5A3 3 0 0 0 18 8Z" /></svg>
      </div>
      <div class="text">
        <span class="label" id="label">Achievement unlocked</span>
        <strong class="title" id="title" dir="auto"></strong>
        <span class="desc" id="desc" dir="auto"></span>
      </div>
    </div>
    <script>
      (function () {
        var lang = "en";
        try {
          lang = localStorage.getItem("saufox.launcher.lang") || ((navigator.language || "").indexOf("fa") === 0 ? "fa" : "en");
        } catch (e) {}
        var fa = lang === "fa";
        document.documentElement.lang = lang;
        document.documentElement.dir = fa ? "rtl" : "ltr";
        var a = ((window.__SAUFOX_ACHIEVEMENT__ || {}).achievement) || {};
        var $ = function (id) { return document.getElementById(id); };
        $("label").textContent = fa ? "دستاورد باز شد" : "Achievement unlocked";
        $("title").textContent = (fa && a.title_fa) || a.title || "";
        $("desc").textContent = (fa && a.description_fa) || a.description || "";
      })();
    </script>
  </body>
</html>
