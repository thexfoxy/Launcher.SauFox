<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SauFox</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <!-- Cyberpunk backdrop: drifting neon glows, a faint grid, and scanlines.
         Purely decorative; it sits behind everything and ignores the pointer. -->
    <div class="fx" aria-hidden="true">
      <span class="fx__glow fx__glow--a"></span>
      <span class="fx__glow fx__glow--b"></span>
      <span class="fx__glow fx__glow--c"></span>
      <span class="fx__grid"></span>
      <span class="fx__scan"></span>
      <span class="fx__noise"></span>
    </div>

    <!-- Frameless window: our own title bar (drag + minimise/maximise/close). -->
    <header id="titlebar" class="titlebar" data-tauri-drag-region>
      <div class="titlebar__brand" data-tauri-drag-region>
        <img src="wordmark.webp" alt="SauFox" draggable="false" />
        <span class="titlebar__tag" translate="no">LAUNCHER</span>
      </div>
      <div class="titlebar__win">
        <button class="win win--min" data-win="min" aria-label="Minimize"><svg viewBox="0 0 12 12"><rect x="2" y="5.4" width="8" height="1.2"/></svg></button>
        <button class="win win--max" data-win="max" aria-label="Maximize"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" fill="none" stroke-width="1.2"/></svg></button>
        <button class="win win--close" data-win="close" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6" stroke-width="1.3"/></svg></button>
      </div>
    </header>

    <div id="app">
      <div class="loading"><span></span></div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
